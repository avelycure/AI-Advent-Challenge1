# Экономный агент: короткие запросы, короткие ответы, жёсткий потолок трат.
# Дойдя до предела, агент поднимает BudgetExceeded и запрос не отправляет.
name: frugal
provider: openai
model: gpt-5.4-nano
system_prompt: Отвечай одним-двумя предложениями. Никакой воды.
generation:
  temperature: 0.2
  max_tokens: 200
input:
  max_chars: 500
  on_too_long: trim     # длинный запрос обрезается, а не отклоняется
  forbid_empty: true
history:
  compression:
    enabled: true
    keep_last: 4        # дословно уходят только последние четыре сообщения
    every: 6            # пересказ обновляется чаще обычного
    max_tokens: 250     # и сам он короче обычного
budget:
  max_tokens: 50000
  max_cost: 0.05
  max_requests: 100
