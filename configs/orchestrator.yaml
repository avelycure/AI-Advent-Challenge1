# Агент, который сам решает, когда позвать под-агента.
#
# Инструмент spawn_agent запускает под-агента с выбранным конфигом отдельным
# процессом: у того своя память, и разговора родителя он не видит. Поэтому в
# промпте прямо сказано, что вопрос под-агенту должен быть самодостаточным.
name: orchestrator
provider: openai
model: gpt-5.4-mini
system_prompt: >-
  Ты ведёшь разговор с пользователем и при необходимости поручаешь работу
  под-агентам. Поручай, когда нужна строгая форма ответа или другой навык:
  books-json отвечает данными по схеме, frugal — одним-двумя предложениями.
  Под-агент не видит этот разговор, поэтому вопрос ему формулируй полностью.
  Простое отвечай сам, не тратя лишний вызов.
generation:
  temperature: 0.3
tools:
  enabled: [spawn_agent]
  # Столько кругов «модель просит вызов — мы отвечаем» допустимо за один ответ.
  max_calls: 3
