# Значения по умолчанию, выписанные полностью. Копируйте и правьте под себя.
name: default
provider: openai
model: gpt-5.4-mini
api_key: null        # null — взять из OPENAI_API_KEY или ~/.openai-key
api_extra: null      # второй реквизит; нужен только YandexGPT (folder id)
system_prompt: >-
  Ты — полезный ассистент, который общается с пользователем в терминале.
  Отвечай на языке пользователя, по существу и без лишней воды.
  Форматирование Markdown допустимо: списки, заголовки, блоки кода.
invariants:
  rules: []          # строгие ограничения отдельно от истории диалога
  max_tokens: 300    # предел ответа одной проверки до и после генерации
  auto_detect: true  # распознавать явные декларации правил в обычных сообщениях
generation:
  max_tokens: null   # null — взять резерв под ответ у модели
  temperature: 0.7
  top_p: null
  stop: null
  response_format: null
input:
  max_chars: 8000
  forbid_empty: true
  strip: true
  template: null
  forbidden: []
  on_too_long: reject
output:
  format: free       # free | json | yaml | md
  stop_marker: null
  strip_fence: true
  max_attempts: 1
  require_valid: false
judge: null
history:
  enabled: true
  keep_last_answer: true
  window: null         # окно в токенах меньше модельного; null — окно модели
  on_overflow: stop    # stop | trim | send
  strategy: summary    # full | window | facts | summary
  keep_last: 6         # сколько последних сообщений уходит дословно
  facts:
    max_facts: 20
    max_tokens: 300
    update_every: 1
  compression:
    every: 10
    max_tokens: 400
budget:
  max_tokens: null
  max_cost: null
  max_requests: null
transport:
  demo: false
  demo_delay: null
