# Ответ оценивается отдельной моделью. Судья задан своим конфигом, поэтому
# судить может другой провайдер: своя оценка своему же ответу — слабый довод.
name: reviewer
provider: openai
model: gpt-5.4
system_prompt: >-
  Ты внимательный рецензент. Отвечай развёрнуто, с обоснованием
  и проверкой собственных выводов.
generation:
  temperature: 0.4
judge:
  scale: 5
  max_tokens: 200
  min_mean: 3.5
  # Каждый признак — пара «имя, что оценивать». Описания в кавычках намеренно:
  # без них YAML разбивает строку по запятым, и пара перестаёт быть парой.
  criteria:
    - ["полнота", "разобрано ли условие, доведено ли решение до конца"]
    - ["ясность", "легко ли проследить ход мысли, есть ли структура"]
    - ["обоснованность", "объяснено ли, почему способ верен, есть ли проверка"]
  agent:
    name: reviewer-judge
    provider: openai
    model: gpt-5.4-mini
    generation:
      temperature: 0.0
    history:
      enabled: false
